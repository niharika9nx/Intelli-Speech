[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelli-speech"
version = "0.1.0"
description = "Reusable utilities for the Intelli-Speech Telugu speech research prototype"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["intelli_speech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
